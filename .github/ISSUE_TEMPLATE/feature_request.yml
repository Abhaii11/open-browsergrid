name: Feature Request
description: Suggest an improvement, integration, or new capability for OpenBrowserGrid
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve, or what workflow would it unlock?
      placeholder: I need per-session SOCKS5 proxy support so concurrent AI agents use separate IPs...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you expect this to work (CLI flags, API endpoint, env var, dashboard UI)?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've tried.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to submit a PR to implement this feature
